backend:
  name: github
  repo: VOTRE-COMPTE-GITHUB/progressfootball
  branch: main
locale: fr
media_folder: images/uploads
public_folder: /images/uploads
collections:
  - name: textes
    label: "Textes du site"
    files:
      - name: site
        label: "Textes, équipe, contacts, réseaux"
        file: content/site.json
        fields:
          - { label: "Titre d'accueil", name: hero_titre, widget: string }
          - { label: "Texte d'accueil", name: hero_texte, widget: text }
          - { label: "Qui sommes-nous (paragraphe 1)", name: qui_1, widget: text }
          - { label: "Qui sommes-nous (paragraphe 2)", name: qui_2, widget: text }
          - { label: "Mot du directeur (une ligne vide entre les paragraphes)", name: mot, widget: text }
          - label: "Équipe"
            name: equipe
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { label: "Nom", name: nom, widget: string }
              - { label: "Fonction", name: role, widget: string }
              - { label: "Photo", name: photo, widget: image, required: false }
          - label: "Contacts"
            name: contacts
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Intitulé", name: label, widget: string }
              - { label: "Valeur (téléphone avec indicatif, courriel ou adresse)", name: valeur, widget: text }
              - { label: "Type", name: type, widget: select, options: [{ label: "Téléphone", value: tel }, { label: "Courriel", value: mail }, { label: "Texte simple", value: texte }] }
              - { label: "Drapeau", name: pays, widget: select, options: [{ label: "Aucun", value: aucun }, { label: "France", value: france }, { label: "Togo", value: togo }] }
          - label: "Réseaux sociaux (liens complets)"
            name: reseaux
            widget: object
            fields:
              - { label: "YouTube", name: youtube, widget: string, required: false }
              - { label: "Facebook", name: facebook, widget: string, required: false }
              - { label: "Instagram", name: instagram, widget: string, required: false }
              - { label: "TikTok", name: tiktok, widget: string, required: false }
  - name: actualites
    label: "Actualités"
    files:
      - name: actualites
        label: "Toutes les actualités"
        file: content/actualites.json
        fields:
          - label: "Actualités"
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.date}} · {{fields.titre}}"
            fields:
              - { label: "Titre", name: titre, widget: string }
              - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
              - { label: "Rubrique", name: rubrique, widget: select, options: ["Actualités générales", "Nos joueurs"] }
              - { label: "Texte", name: texte, widget: text }
              - { label: "Photo (facultative)", name: image, widget: image, required: false }
  - name: calendrier
    label: "Calendrier"
    files:
      - name: evenements
        label: "Événements à venir"
        file: content/evenements.json
        fields:
          - label: "Événements"
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.date}} · {{fields.titre}}"
            fields:
              - { label: "Titre", name: titre, widget: string }
              - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
              - { label: "Lieu", name: lieu, widget: string, required: false }
              - { label: "Type", name: type, widget: select, options: ["Tournoi", "Match", "Cérémonie", "Détection", "Autre"] }
              - { label: "Détails", name: description, widget: text, required: false }
  - name: photos
    label: "Photothèque"
    files:
      - name: photos
        label: "Photos des activités"
        file: content/photos.json
        fields:
          - label: "Photos"
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.date}} · {{fields.occasion}}"
            fields:
              - { label: "Photo", name: image, widget: image }
              - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
              - { label: "Occasion (match, cérémonie, entraînement...)", name: occasion, widget: string }
